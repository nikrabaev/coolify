name: fork-sync

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [fork-main]
  workflow_dispatch:

concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions: {}

jobs:
  probe:
    # UNPRIVILEGED. Reads upstream PR state and reports. No secrets, no
    # credentials, and nothing from an unpinned PR head is ever executed here.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Pin-update and PR-lifecycle proposals are filed as issues, so this must
      # be issues: write — pull-requests: write does not grant issue creation.
      # No contents: write on purpose: this job cannot push a branch, so it
      # could not open a real pull request even if we wanted one.
      issues: write
    outputs:
      report: ${{ steps.classify.outputs.report }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fork-main
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - run: npm ci

      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node fork/bin/probe-cli.mjs >> "$GITHUB_OUTPUT"

  release:
    # PRIVILEGED. Consumes only reviewed, pinned SHAs from patches.yaml.
    #
    # `needs: probe` orders the jobs, but `if: !cancelled()` deliberately lets this
    # run even when probe fails. Probe is advisory: it reports on upstream PR state
    # and files issues, and this job consumes none of its output — the build
    # decision comes from the fingerprint computed below. Without the override, a
    # transient GitHub API error while probing would skip the release entirely and
    # block every build. Probe still goes red so the failure stays visible.
    needs: probe
    if: ${{ !cancelled() }}
    # Native arm64 runner, because the image below is linux/arm64 (the target
    # server is an ARM instance). Building arm64 on an amd64 runner goes through
    # QEMU emulation — a earlier run exceeded two hours and was still going.
    # arm64 runners are free for public repositories.
    runs-on: ubuntu-24.04-arm
    # Bounded so a hung build cannot occupy the concurrency group indefinitely;
    # cancel-in-progress is false, so a stuck run would block every later one.
    # A healthy native-arm64 release completes in roughly 10-15 minutes.
    timeout-minutes: 45
    # actions/deploy-pages requires its job to target the github-pages
    # environment; without this the deploy fails at runtime.
    environment: github-pages
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
      issues: write # failures are escalated as issues
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fork-main
          fetch-depth: 0
          # Without this, checkout leaves an http.extraheader carrying
          # GITHUB_TOKEN's Authorization for every github.com URL. That header
          # overrides the credentials in a rewritten remote URL, so pushes kept
          # authenticating as the GitHub App and were rejected for touching
          # .github/workflows/ — even with FORK_SYNC_TOKEN configured.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Verify fingerprint purity invariant
        run: npm test

      - name: Authenticate pushes with the release token
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          # GITHUB_TOKEN may never create or update files under .github/workflows/,
          # and that cannot be granted via the permissions: block — it is a
          # token-level scope. Both `prod` and every release tag carry upstream's
          # workflow files, so pushing them needs a fine-grained PAT instead.
          if [ -z "$FORK_SYNC_TOKEN" ]; then
            echo "FATAL: repository secret FORK_SYNC_TOKEN is not set."
            echo "Create a fine-grained PAT scoped to this repository with"
            echo "Contents: Read and write AND Workflows: Read and write, then add it"
            echo "as the FORK_SYNC_TOKEN secret. Without it the release tag and prod"
            echo "branch cannot be pushed."
            exit 1
          fi
          # Belt and braces: checkout runs with persist-credentials: false, but
          # drop any lingering Authorization header anyway — it would override
          # the URL credentials below and silently push as the GitHub App again.
          git config --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
          # Rewriting origin routes every later push (mirror, tag, prod, state)
          # through this token. resolveRemotes() matches on the repo path and
          # tolerates userinfo in the URL, so remote resolution is unaffected.
          git remote set-url origin \
            "https://x-access-token:${FORK_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Configure git identity
        # Runners have no identity configured, and this job creates commits in
        # three places: the merge commits in rebuild, the version stamp, and the
        # state record. Set it globally so it applies inside the .build worktree
        # too. Local tests passed only because their fixtures set an identity.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # rerere is deliberately NOT enabled, and state/rr-cache is not restored.
      #
      # It was originally enabled to avoid re-resolving the same conflict on
      # every release. But rerere replays a recorded resolution onto a *new*
      # upstream base with no re-review and no signal in the merge output: a
      # resolution that was correct for v4.3.2 and wrong for v4.4.0 would merge
      # clean and ship. That silently violates the property this whole design
      # rests on — that only human-reviewed content reaches the image. There is
      # no way to keep rerere's recording while disabling its replay, so it is
      # off. Conflicts now always halt the run and escalate with the conflicting
      # paths, and a human resolves them. Conflicts should be rare: the patch
      # set is small, and the cost of re-resolving one is far below the cost of
      # shipping an unreviewed merge.
      - name: Ensure rerere is off
        run: git config rerere.enabled false

      - name: Resolve base tag and fingerprint
        id: fp
        run: node fork/bin/fingerprint-cli.mjs

      - name: Stop if nothing changed
        if: steps.fp.outputs.changed != 'true'
        run: echo "Fingerprint unchanged; nothing to build."

      - name: Create build worktree
        if: steps.fp.outputs.changed == 'true'
        # fork-main's tracked files (fork/, patches.yaml) would vanish from the
        # working tree if we checked out prod-next in place. The build happens
        # in a linked worktree instead; the object store and rerere cache are
        # shared, and the tooling stays available at the workspace root.
        run: git worktree add .build "${{ steps.fp.outputs.base_sha }}"

      - name: Rebuild prod-next
        if: steps.fp.outputs.changed == 'true'
        working-directory: .build
        run: node "$GITHUB_WORKSPACE/fork/bin/rebuild.mjs" "${{ steps.fp.outputs.base_tag }}" "$GITHUB_WORKSPACE/patches.yaml"

      # There is deliberately no test gate here. Upstream runs no tests in CI at
      # all — no workflow references artisan test / phpunit / pest, and their
      # release workflow only promotes a prebuilt image — and upstream's own
      # v4.3.2 tag fails ~753 tests in a clean environment even with Redis and
      # built assets. A red suite cannot answer "did our patches break
      # something" without a baseline comparison against the base tag, so gating
      # on it would cost time and produce no signal. What protects a release
      # instead: only reviewed pinned SHAs are ever merged (see patches.yaml),
      # the version stamp is verified against bootstrap/getVersion.php below,
      # published artifacts are hash-verified before versions.json advertises
      # them, and :latest is promoted only after that. If a future patch touches
      # PHP and you want real coverage, the right tool is a base-vs-merged
      # failure delta, not a bare suite run.
      #
      # PHP is still needed below for the version-stamp guard.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: steps.fp.outputs.changed == 'true'
        with:
          php-version: '8.4'

      - name: Allocate version and stamp it into the tree
        if: steps.fp.outputs.changed == 'true'
        id: version
        working-directory: .build
        env:
          BASE_TAG: ${{ steps.fp.outputs.base_tag }}
        run: |
          # Fork tags are the allocation record; origin is the fork.
          git fetch --tags --quiet origin
          VERSION=$(node "$GITHUB_WORKSPACE/fork/bin/publish.mjs" allocate-version)
          git commit -qam "release: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Assemble the Pages site
        if: steps.fp.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEST_DIR: site/releases/${{ steps.version.outputs.version }}
        run: |
          # NOTE the layout: the uploaded artifact's root IS already
          # https://nikrabaev.github.io/coolify/ , because this is a project
          # Pages site for a repo named "coolify". So versions.json and
          # upgrade.sh go at the root of site/, NOT under site/coolify/ —
          # nesting them produced /coolify/coolify/... and 404'd every fetch.
          # Coolify asks for ${CDN_URL}/coolify/versions.json, and with
          # CDN_URL=https://nikrabaev.github.io that resolves to site/versions.json.
          #
          # Every artifact comes from the built .build tree, never fork-main.
          mkdir -p "$DEST_DIR"
          cp .build/docker-compose.yml .build/docker-compose.prod.yml .build/.env.production "$DEST_DIR/"
          cp .build/scripts/upgrade-postgres.sh "$DEST_DIR/"
          cp .build/scripts/upgrade.sh site/upgrade.sh
          # versions.json is deliberately NOT placed into site/ yet; see
          # buildVersionsForkJson in fork/bin/publish.mjs.
          node fork/bin/publish.mjs assemble-site

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.fp.outputs.changed == 'true'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.fp.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.fp.outputs.changed == 'true'
        with:
          context: .build
          file: .build/docker/production/Dockerfile
          # Single native architecture. Add a second platform only alongside a
          # matrix of native runners plus a manifest merge (upstream's
          # coolify-sha-build.yml is the model) — never as a second platform
          # here, which silently reintroduces multi-hour emulated builds.
          platforms: linux/arm64
          push: true
          # Only the immutable version tag is pushed here. `:latest` is promoted
          # after the release is verified and advertised — see below. Pushing it
          # now would move `:latest` before the CDN artifacts are known-good, and
          # nothing rolls it back on a later failure; docker-compose.prod.yml
          # falls back to `:latest` whenever LATEST_IMAGE is unset, which would
          # bypass the versions.json pointer this design is built around.
          tags: ghcr.io/nikrabaev/coolify:${{ steps.version.outputs.version }}

      # Both Pages uploads must use distinct artifact names: upload-artifact v4
      # rejects a duplicate name within one workflow run, and this job uploads
      # twice on purpose (versions.json is withheld from the first deploy).
      - name: Publish artifacts (versions.json withheld)
        if: steps.fp.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          name: github-pages-artifacts

      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.fp.outputs.changed == 'true'
        with:
          artifact_name: github-pages-artifacts

      - name: Verify published artifacts by content hash
        if: steps.fp.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # pipefail is essential here. Without it a pipeline reports the status
          # of its LAST command, so a 404 from curl would still exit 0 via
          # sha256sum and "succeed" with the hash of empty input — breaking out
          # of the retry on exactly the propagation delay the retry exists for,
          # then failing with a misleading "hash mismatch".
          set -o pipefail
          BASE="https://nikrabaev.github.io/coolify/releases/${VERSION}"
          for f in docker-compose.yml docker-compose.prod.yml .env.production upgrade-postgres.sh; do
            REMOTE=""
            for attempt in 1 2 3 4 5 6; do
              REMOTE=$(curl -fsSL "${BASE}/${f}" | sha256sum | cut -d' ' -f1) && break
              echo "attempt ${attempt}: ${f} not served yet; waiting for Pages to propagate"
              REMOTE=""
              sleep 20
            done
            if [ -z "$REMOTE" ]; then
              echo "FATAL: ${BASE}/${f} never became reachable; refusing to advertise this release"
              exit 1
            fi
            LOCAL=$(sha256sum "site/releases/${VERSION}/${f}" | cut -d' ' -f1)
            test "$REMOTE" = "$LOCAL" || { echo "hash mismatch for ${f}"; exit 1; }
          done

      - name: Advertise the release
        if: steps.fp.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The tag comes from the built worktree HEAD; origin is the fork. It is
          # both the version-allocation record and the audit trail — it points at
          # the exact tree that was built and published.
          #
          # Deliberately NOT pushing a `prod` branch, and deliberately not
          # mirroring upstream's default branch either. Both refs carry upstream's
          # own workflow files, and upstream's workflows trigger on pushes to
          # `main` (coolify-sha-build, coolify-helper, coolify-realtime,
          # generate-changelog) and, via branches-ignore, to any other branch such
          # as `prod` (coolify-staging-build). Those then fail daily on a missing
          # DOCKERHUB_* secret. Disabling them does not stick: the files are not on
          # the default branch, so GitHub recreates the workflow record — enabled —
          # each time a push triggers it. None of them trigger on tags, so pushing
          # only the tag keeps the record and the audit trail without the noise.
          git -C .build push --quiet origin "HEAD:refs/tags/${VERSION}"
          # versions.json becomes visible only now — it is the release pointer.
          cp versions.fork.json site/versions.json

      - name: Publish versions.json (advertises the release)
        if: steps.fp.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
          name: github-pages-advertised

      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.fp.outputs.changed == 'true'
        with:
          artifact_name: github-pages-advertised

      - name: Promote :latest to the advertised release
        if: steps.fp.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Runs only after the release is verified and advertised, so `:latest`
          # can never point at a build whose CDN artifacts failed to publish.
          # imagetools retags the existing multi-arch manifest — no rebuild.
          docker buildx imagetools create \
            "ghcr.io/nikrabaev/coolify:${VERSION}" \
            --tag ghcr.io/nikrabaev/coolify:latest

      - name: Record success
        if: steps.fp.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FINGERPRINT: ${{ steps.fp.outputs.fingerprint }}
        run: |
          # The workspace root never left fork-main; only .build holds prod-next.
          node -e "
            import('./fork/lib/state.js').then((m) =>
              m.writeLastSuccess('state/last-success.json', {
                fingerprint: process.env.FINGERPRINT,
                version: process.env.VERSION,
              }))
          "
          git add state/
          git commit -qm "chore(fork): record ${VERSION} [skip ci]" || true
          git push --quiet origin HEAD:fork-main

      - name: Escalate on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_TAG: ${{ steps.fp.outputs.base_tag }}
        run: |
          # gh does not auto-create labels; ensure it exists idempotently
          # before filing so a missing label never swallows this escalation.
          # An "already exists" failure (or any other) is swallowed: this
          # step must reach `gh issue create` regardless.
          gh label create fork-sync \
            --repo "${{ github.repository }}" \
            --description "Automated fork-sync notifications" \
            --color ededed || true
          # Deduplicate before filing. A stuck conflict or a persistently broken
          # base tag fails on every daily run; without this check that is one new
          # issue per day forever. Exact-title match on open fork-sync issues,
          # mirroring isAlreadyFiled() in fork/bin/probe-cli.mjs — deliberately
          # not `--search`, whose tokenizer is unreliable for titles containing
          # ':' and '#'.
          # export, not a bare shell var: --jq reads env.TITLE from the process
          # environment, so an unexported variable would compare against null
          # and never match, silently defeating the dedup.
          export TITLE="fork-sync failed on ${BASE_TAG}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --label fork-sync --state open --json title --limit 200 \
            --jq '[.[] | select(.title == env.TITLE)] | length' 2>/dev/null || echo 0)
          if [ "${EXISTING:-0}" != "0" ]; then
            echo "An open issue titled \"${TITLE}\" already exists; not filing a duplicate."
            exit 0
          fi
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "${TITLE}" \
            --label fork-sync \
            --body "$(printf '%s\n' \
              "The scheduled fork-sync run failed." \
              "" \
              "- base tag: \`${BASE_TAG}\`" \
              "- run: ${RUN_URL}" \
              "" \
              "Reproduce locally:" \
              '```bash' \
              "git fetch upstream --tags" \
              "node fork/bin/rebuild.mjs ${BASE_TAG}" \
              '```' \
              "" \
              "Resolve with @claude on this issue, or a local session. \`patches.yaml\` is never changed automatically.")"
