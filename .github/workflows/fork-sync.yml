name: fork-sync

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [fork-main]
  workflow_dispatch:

concurrency:
  group: fork-sync
  cancel-in-progress: false

permissions: {}

jobs:
  probe:
    # UNPRIVILEGED. Reads upstream PR state and reports. No secrets, no
    # credentials, and nothing from an unpinned PR head is ever executed here.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Pin-update and PR-lifecycle proposals are filed as issues, so this must
      # be issues: write — pull-requests: write does not grant issue creation.
      # No contents: write on purpose: this job cannot push a branch, so it
      # could not open a real pull request even if we wanted one.
      issues: write
    outputs:
      report: ${{ steps.classify.outputs.report }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fork-main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node fork/bin/probe-cli.mjs >> "$GITHUB_OUTPUT"

  release:
    # PRIVILEGED. Consumes only reviewed, pinned SHAs from patches.yaml.
    #
    # `needs: probe` orders the jobs, but `if: !cancelled()` deliberately lets this
    # run even when probe fails. Probe is advisory: it reports on upstream PR state
    # and files issues, and this job consumes none of its output — the build
    # decision comes from the fingerprint computed below. Without the override, a
    # transient GitHub API error while probing would skip the release entirely and
    # block every build. Probe still goes red so the failure stays visible.
    needs: probe
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
      issues: write # failures are escalated as issues
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fork-main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Verify fingerprint purity invariant
        run: npm test

      - name: Restore rerere cache
        run: |
          mkdir -p .git/rr-cache
          cp -r state/rr-cache/. .git/rr-cache/ 2>/dev/null || true
          git config rerere.enabled true

      - name: Resolve base tag and fingerprint
        id: fp
        run: node fork/bin/fingerprint-cli.mjs

      - name: Mirror v4.x from upstream
        run: |
          # fingerprint-cli guarantees an `upstream` remote exists (it adds one
          # by URL when missing). `origin` is the fork: actions/checkout made it so.
          git fetch --quiet upstream v4.x
          git push --quiet origin refs/remotes/upstream/v4.x:refs/heads/v4.x

      - name: Stop if nothing changed
        if: steps.fp.outputs.changed != 'true'
        run: echo "Fingerprint unchanged; nothing to build."

      - name: Create build worktree
        if: steps.fp.outputs.changed == 'true'
        # fork-main's tracked files (fork/, patches.yaml) would vanish from the
        # working tree if we checked out prod-next in place. The build happens
        # in a linked worktree instead; the object store and rerere cache are
        # shared, and the tooling stays available at the workspace root.
        run: git worktree add .build "${{ steps.fp.outputs.base_sha }}"

      - name: Rebuild prod-next
        if: steps.fp.outputs.changed == 'true'
        working-directory: .build
        run: node "$GITHUB_WORKSPACE/fork/bin/rebuild.mjs" "${{ steps.fp.outputs.base_tag }}" "$GITHUB_WORKSPACE/patches.yaml"

      - uses: shivammathur/setup-php@v2
        if: steps.fp.outputs.changed == 'true'
        with:
          php-version: '8.4'

      - name: Correctness gate
        if: steps.fp.outputs.changed == 'true'
        working-directory: .build
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/pint --test
          php artisan test --compact

      - name: Escalate on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE_TAG: ${{ steps.fp.outputs.base_tag }}
        run: |
          # gh does not auto-create labels; ensure it exists idempotently
          # before filing so a missing label never swallows this escalation.
          # An "already exists" failure (or any other) is swallowed: this
          # step must reach `gh issue create` regardless.
          gh label create fork-sync \
            --repo "${{ github.repository }}" \
            --description "Automated fork-sync notifications" \
            --color ededed || true
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "fork-sync failed on ${BASE_TAG}" \
            --label fork-sync \
            --body "$(printf '%s\n' \
              "The scheduled fork-sync run failed." \
              "" \
              "- base tag: \`${BASE_TAG}\`" \
              "- run: ${RUN_URL}" \
              "" \
              "Reproduce locally:" \
              '```bash' \
              "git fetch upstream --tags" \
              "node fork/bin/rebuild.mjs ${BASE_TAG}" \
              '```' \
              "" \
              "Resolve with @claude on this issue, or a local session. \`patches.yaml\` is never changed automatically.")"
