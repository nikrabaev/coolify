# Applied in file order onto the newest upstream v4.x.y tag.
#
# type: pr     -> an upstream pull request. `sha` is MANDATORY and is a trust
#                 statement: a human reviewed exactly this commit. The build
#                 merges the pin, never the live head.
# type: branch -> a branch in this repository (inside the trust boundary).
base: latest-tag
patches:
  - id: cdn-hardening
    type: branch
    ref: patch/fork-cdn-hardening
    reason: repoint upgrade.sh CDN, versioned release paths, fail-fast downloads
  - id: infisical-integration
    type: branch
    ref: patch/infisical-integration
    reason: native Infisical secret sync (pre-deploy sync, webhook/poll redeploy, per-resource config)
  - id: env-var-delete-guard
    type: branch
    ref: patch/env-var-delete-guard
    reason: compose env-var delete guard matched keys instead of values, blocking deletion of every left-hand name in a compose file
  - id: helper-container-cleanup
    type: branch
    ref: patch/helper-container-cleanup
    reason: timed-out/cancelled deployments orphaned the coolify-helper build container, which kept building forever (CPU/RAM/disk exhaustion; observed 8-day-old helper)
  - id: upgrade-restart-completion
    type: branch
    ref: patch/upgrade-restart-completion
    reason: upgrade modal hung on the restart step; the running version was read from the browser's Livewire snapshot, so it never reached the target and the status file was already deleted by the time the new container answered
